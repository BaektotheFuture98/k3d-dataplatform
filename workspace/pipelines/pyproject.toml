[project]
name = "finance-article-pipelines"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic-settings==2.15.0"]

[project.optional-dependencies]
semantic = [
    "google-genai==2.22.0",
    "pydantic==2.13.5",
    "pyshacl==0.40.1",
    "rdflib==7.6.0",
]

[dependency-groups]
test = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "article_silver_to_gold"]
testpaths = ["tests", "article_bronze_to_silver/tests"]
