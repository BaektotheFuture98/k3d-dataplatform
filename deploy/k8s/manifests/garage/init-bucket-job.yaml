apiVersion: batch/v1
kind: Job
metadata:
  generateName: garage-s3-check-
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: garage-s3-check
    app.kubernetes.io/component: verification
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-s3-check
        app.kubernetes.io/component: verification
        app.kubernetes.io/part-of: finance-platform
        app.kubernetes.io/managed-by: kubectl
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: s3-check
          image: finance-platform/s3-check:boto3-1.40.59-v1
          imagePullPolicy: Never
          env:
            - {name: S3_ENDPOINT, value: 'http://garage.finance-platform.svc.cluster.local:3900'}
            - {name: S3_BUCKET, value: warehouse}
            - {name: AWS_DEFAULT_REGION, value: garage}
            - {name: AWS_EC2_METADATA_DISABLED, value: 'true'}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: s3-access-key-id}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: s3-secret-access-key}
            - name: VERIFY_TOKEN
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - {name: EXPECT_KEY, value: ''}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: checks, mountPath: /checks, readOnly: true}
      volumes:
        - name: checks
          configMap: {name: garage-s3-check}
