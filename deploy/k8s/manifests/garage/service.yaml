apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: finance-platform
  ports:
    - {name: s3, port: 3900, targetPort: s3}
---
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: finance-platform
  ports:
    - {name: s3, port: 3900, targetPort: s3}
