apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: garage-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/part-of: finance-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/component: object-storage
        app.kubernetes.io/part-of: finance-platform
        app.kubernetes.io/managed-by: kubectl
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1@sha256:2749e37137dae41459f49955e8082951f4a1ebea4e25d153182039f20a4b5974
          command: [/garage]
          args: [server, --single-node, --default-bucket]
          env:
            # Default-key bootstrap logs include its ID at info level.
            - {name: RUST_LOG, value: warn}
            - {name: GARAGE_DEFAULT_BUCKET, value: warehouse}
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: rpc-secret}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: admin-token}
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: s3-access-key-id}
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: s3-secret-access-key}
          ports:
            - {name: s3, containerPort: 3900}
            - {name: admin, containerPort: 3903}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/garage}
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true}
      volumes:
        - name: config
          configMap: {name: garage-config}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: garage
          app.kubernetes.io/component: object-storage
          app.kubernetes.io/part-of: finance-platform
          app.kubernetes.io/managed-by: kubectl
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 10Gi}
