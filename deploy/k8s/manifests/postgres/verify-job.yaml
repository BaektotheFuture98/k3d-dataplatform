apiVersion: batch/v1
kind: Job
metadata:
  generateName: postgres-verify-
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: postgres-verify
    app.kubernetes.io/component: verification
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-verify
        app.kubernetes.io/component: verification
        app.kubernetes.io/part-of: finance-platform
        app.kubernetes.io/managed-by: kubectl
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: verify
          image: postgres:17-bookworm@sha256:a85953d6f830fd55a12929df3b7a4fa94dc96d652de62d2d714e0867ccb3670d
          command: [bash, -ceu]
          args:
            - |
              set -o pipefail
              export PGHOST=postgres.finance-platform.svc.cluster.local PGPORT=5432 PGCONNECT_TIMEOUT=5
              verify_user() {
                export PGUSER="$1" PGDATABASE="$2" PGPASSWORD
                PGPASSWORD="$(cat "/run/secrets/postgres/$3")"
                local other_db="$4"
                test "$(psql -XAtw -v ON_ERROR_STOP=1 -c 'SELECT current_user')" = "$PGUSER"
                test "$(psql -XAtw -v ON_ERROR_STOP=1 -c 'SELECT rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls FROM pg_roles WHERE rolname=current_user')" = f
                psql -Xw -v ON_ERROR_STOP=1 -v token="$VERIFY_TOKEN" <<'SQL'
              CREATE TABLE IF NOT EXISTS public.platform_validation_persistence_probe(token text PRIMARY KEY);
              INSERT INTO public.platform_validation_persistence_probe VALUES (:'token') ON CONFLICT DO NOTHING;
              BEGIN;
              CREATE TABLE public.platform_validation_transaction_probe(id integer PRIMARY KEY, value text);
              INSERT INTO public.platform_validation_transaction_probe VALUES (1, 'before');
              UPDATE public.platform_validation_transaction_probe SET value='after' WHERE id=1;
              SELECT 1 / count(*)::integer FROM public.platform_validation_transaction_probe WHERE value='after';
              DELETE FROM public.platform_validation_transaction_probe;
              DROP TABLE public.platform_validation_transaction_probe;
              COMMIT;
              SQL
                if test -n "${EXPECT_TOKEN:-}"; then
                  test "$(psql -XAtw -v ON_ERROR_STOP=1 -v token="$EXPECT_TOKEN" <<'SQL'
              SELECT count(*) FROM public.platform_validation_persistence_probe WHERE token=:'token';
              SQL
                  )" = 1
                fi
                if psql -XAtw -d "$other_db" -c 'SELECT 1' >/dev/null 2>&1; then
                  echo "FAIL: $PGUSER can access $other_db" >&2; exit 1
                fi
                if PGPASSWORD=deliberately-invalid psql -XAtw -c 'SELECT 1' >/dev/null 2>&1; then
                  echo 'FAIL: wrong password accepted' >&2; exit 1
                fi
                echo "PASS: $PGUSER auth, privileges, DDL/DML, isolation, persistence"
              }
              verify_user airflow_user airflow_meta airflow-password iceberg_catalog
              verify_user iceberg_user iceberg_catalog iceberg-password airflow_meta
          env:
            - name: VERIFY_TOKEN
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: EXPECT_TOKEN
              value: ""
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets/postgres
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: postgres-credentials
            defaultMode: 0444
            items:
              - {key: airflow-password, path: airflow-password}
              - {key: iceberg-password, path: iceberg-password}
