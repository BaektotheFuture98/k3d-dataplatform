apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tailscale-jupyter
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: platform-ui
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: platform-config
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`seonmin-mac-mini.tail481f72.ts.net`) && Header(`X-Forwarded-Host`, `seonmin-mac-mini.tail481f72.ts.net:8443`)
      priority: 1000
      services:
        - name: jupyter
          port: 8888
