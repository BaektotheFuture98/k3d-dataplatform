apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ui
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: platform-ui
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: platform-config
spec:
  ingressClassName: traefik
  rules:
    - host: jupyter.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jupyter
                port:
                  number: 8888
    - host: airflow.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow-api-server
                port:
                  number: 8080
