apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-workspace
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: jupyter
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/component: compute
    app.kubernetes.io/managed-by: platform-config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: jupyter
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/component: compute
    app.kubernetes.io/managed-by: platform-config
spec:
  # On-demand notebook; reserve the two-core node for platform services.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jupyter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jupyter
        app.kubernetes.io/part-of: finance-platform
        app.kubernetes.io/component: compute
        app.kubernetes.io/managed-by: platform-config
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jupyter
          image: __SPARK_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: SPARK_CONF_DIR
              value: /etc/spark
            - name: AWS_REGION
              value: garage
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jupyter-auth
                  key: token
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-credentials
                  key: s3-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-credentials
                  key: s3-secret-access-key
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/spark
              readOnly: true
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: config
          configMap:
            name: spark-config
        - name: workspace
          persistentVolumeClaim:
            claimName: jupyter-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: finance-platform
  labels:
    app.kubernetes.io/name: jupyter
    app.kubernetes.io/part-of: finance-platform
    app.kubernetes.io/component: compute
    app.kubernetes.io/managed-by: platform-config
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jupyter
  ports:
    - name: http
      port: 8888
      targetPort: http
