apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: finance-platform
  labels:
    strimzi.io/cluster: finance-kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/managed-by: platform-config
    app.kubernetes.io/part-of: finance-platform
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: local-path
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 150m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1536Mi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
