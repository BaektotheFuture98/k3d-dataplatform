{
  "apiVersion": "batch/v1",
  "kind": "CronJob",
  "metadata": {
    "name": "gold-publisher",
    "namespace": "finance-platform",
    "labels": {
      "app.kubernetes.io/name": "gold-publisher",
      "app.kubernetes.io/part-of": "finance-platform",
      "app.kubernetes.io/component": "pipeline",
      "app.kubernetes.io/managed-by": "platform-config"
    }
  },
  "spec": {
    "schedule": "*/5 * * * *",
    "suspend": true,
    "concurrencyPolicy": "Forbid",
    "startingDeadlineSeconds": 120,
    "successfulJobsHistoryLimit": 1,
    "failedJobsHistoryLimit": 2,
    "jobTemplate": {
      "spec": {
        "backoffLimit": 1,
        "activeDeadlineSeconds": 240,
        "ttlSecondsAfterFinished": 86400,
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "gold-publisher",
              "app.kubernetes.io/part-of": "finance-platform",
              "app.kubernetes.io/component": "pipeline",
              "app.kubernetes.io/managed-by": "platform-config"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "restartPolicy": "Never",
            "terminationGracePeriodSeconds": 120,
            "containers": [
              {
                "name": "base",
                "image": "__GOLD_PUBLISHER_IMAGE__",
                "imagePullPolicy": "IfNotPresent",
                "env": [
                  {
                    "name": "AWS_ENDPOINT_URL",
                    "value": "http://garage.finance-platform.svc.cluster.local:3900"
                  },
                  {
                    "name": "AWS_REGION",
                    "value": "garage"
                  },
                  {
                    "name": "S3_PATH_STYLE_ACCESS",
                    "value": "true"
                  },
                  {
                    "name": "S3_SIGNATURE_VERSION",
                    "value": "s3v4"
                  },
                  {
                    "name": "WAREHOUSE_URI",
                    "value": "s3://warehouse/"
                  },
                  {
                    "name": "ICEBERG_CATALOG_URI",
                    "value": "http://iceberg-rest:8181"
                  },
                  {
                    "name": "AWS_ACCESS_KEY_ID",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "garage-credentials",
                        "key": "s3-access-key-id"
                      }
                    }
                  },
                  {
                    "name": "AWS_SECRET_ACCESS_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "garage-credentials",
                        "key": "s3-secret-access-key"
                      }
                    }
                  },
                  {
                    "name": "KAFKA_BOOTSTRAP_SERVERS",
                    "value": "finance-kafka-kafka-bootstrap:9092"
                  },
                  {
                    "name": "KAFKA_TOPIC",
                    "value": "article-gold"
                  },
                  {
                    "name": "PUBLISHER_STATE_URI",
                    "value": "s3://warehouse/checkpoints/gold-publisher/"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "512Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "2Gi"
                  }
                }
              }
            ]
          }
        }
      }
    }
  }
}
