{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "airflow-jobs",
    "namespace": "finance-platform",
    "labels": {
      "app.kubernetes.io/name": "airflow-jobs",
      "app.kubernetes.io/part-of": "finance-platform",
      "app.kubernetes.io/component": "pipeline",
      "app.kubernetes.io/managed-by": "platform-config"
    }
  }
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "airflow-jobs",
    "namespace": "finance-platform",
    "labels": {
      "app.kubernetes.io/name": "airflow-jobs",
      "app.kubernetes.io/part-of": "finance-platform",
      "app.kubernetes.io/component": "pipeline",
      "app.kubernetes.io/managed-by": "platform-config"
    }
  },
  "rules": [
    {
      "apiGroups": [
        "batch"
      ],
      "resources": [
        "jobs"
      ],
      "verbs": [
        "create",
        "get",
        "list",
        "watch",
        "delete",
        "patch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "delete",
        "patch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods/log"
      ],
      "verbs": [
        "get"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "airflow-jobs",
    "namespace": "finance-platform",
    "labels": {
      "app.kubernetes.io/name": "airflow-jobs",
      "app.kubernetes.io/part-of": "finance-platform",
      "app.kubernetes.io/component": "pipeline",
      "app.kubernetes.io/managed-by": "platform-config"
    }
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "airflow-jobs",
      "namespace": "finance-platform"
    }
  ],
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "airflow-jobs"
  }
}
