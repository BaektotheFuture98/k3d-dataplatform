{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "bronze-to-silver",
    "namespace": "finance-platform",
    "labels": {
      "app.kubernetes.io/name": "bronze-to-silver",
      "app.kubernetes.io/part-of": "finance-platform",
      "app.kubernetes.io/component": "pipeline",
      "app.kubernetes.io/managed-by": "platform-config"
    }
  },
  "spec": {
    "replicas": 0,
    "revisionHistoryLimit": 2,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "bronze-to-silver"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "bronze-to-silver",
          "app.kubernetes.io/part-of": "finance-platform",
          "app.kubernetes.io/component": "pipeline",
          "app.kubernetes.io/managed-by": "platform-config"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "restartPolicy": "Always",
        "terminationGracePeriodSeconds": 120,
        "containers": [
          {
            "name": "pipeline",
            "image": "__BRONZE_TO_SILVER_IMAGE__",
            "imagePullPolicy": "IfNotPresent",
            "env": [
              {
                "name": "AWS_REGION",
                "value": "garage"
              },
              {
                "name": "AWS_ACCESS_KEY_ID",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "garage-credentials",
                    "key": "s3-access-key-id"
                  }
                }
              },
              {
                "name": "AWS_SECRET_ACCESS_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "garage-credentials",
                    "key": "s3-secret-access-key"
                  }
                }
              },
              {
                "name": "SPARK_CONF_DIR",
                "value": "/etc/spark"
              },
              {
                "name": "AWS_REQUEST_CHECKSUM_CALCULATION",
                "value": "WHEN_REQUIRED"
              },
              {
                "name": "AWS_RESPONSE_CHECKSUM_VALIDATION",
                "value": "WHEN_REQUIRED"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "250m",
                "memory": "512Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "2Gi"
              }
            },
            "volumeMounts": [
              {
                "name": "spark-config",
                "mountPath": "/etc/spark",
                "readOnly": true
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "bronze-to-silver-config"
                }
              }
            ],
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 185,
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            }
          }
        ],
        "volumes": [
          {
            "name": "spark-config",
            "configMap": {
              "name": "spark-config"
            }
          }
        ]
      }
    }
  }
}
