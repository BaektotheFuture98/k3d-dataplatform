apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-executor-worker
  namespace: pipelines
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-executor-pod-launcher
  namespace: pipelines
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-executor-pod-launcher
  namespace: pipelines
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-executor-pod-launcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-executor-log-reader
  namespace: pipelines
rules:
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-executor-log-reader
  namespace: pipelines
subjects:
  - kind: ServiceAccount
    name: airflow-api-server
    namespace: pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-executor-log-reader
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-executor-dags
  namespace: pipelines
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-executor-logs
  namespace: pipelines
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
