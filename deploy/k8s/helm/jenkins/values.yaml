controller:
  serviceType: ClusterIP
  ingress:
    enabled: false
  numExecutors: 0
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {cpu: '2', memory: 2Gi}
  javaOpts: '-Xms256m -Xmx1024m'
  sidecars:
    configAutoReload:
      enabled: false

persistence:
  enabled: true
  storageClass: local-path
  size: 10Gi

agent:
  enabled: true
  podRetention: Never
  resources:
    requests: {cpu: 100m, memory: 256Mi}

rbac:
  create: true
  readSecrets: false
