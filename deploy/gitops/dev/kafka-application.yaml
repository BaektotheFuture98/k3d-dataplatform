apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dev-kafka
  namespace: argocd
spec:
  project: platform-dev
  source:
    repoURL: https://github.com/BaektotheFuture98/k3d-dataplatform.git
    targetRevision: main
    path: deploy/k8s/manifests/kafka
    directory:
      include: '{kafka-nodepool.yaml,kafka.yaml,kafka-topics.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
