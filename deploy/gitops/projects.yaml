apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: platform-tools
spec:
  sourceRepos: []
  destinations: []
  namespaceResourceBlacklist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-data
  namespace: platform-tools
spec:
  sourceRepos:
    - https://github.com/BaektotheFuture98/k3d-dataplatform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: lakehouse
    - server: https://kubernetes.default.svc
      namespace: pipelines
  clusterResourceWhitelist: []
