apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos: []
  destinations: []
  namespaceResourceBlacklist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-dev
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/BaektotheFuture98/k3d-dataplatform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dev
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-stage
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/BaektotheFuture98/k3d-dataplatform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: stage
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-prod
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/BaektotheFuture98/k3d-dataplatform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: prod
  clusterResourceWhitelist: []
